<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Islamabad & Pindi Smart Traffic Control</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #080c14;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
    }

    #map {
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Floating UI Navigation Panel */
    .dashboard-panel {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 480px;
      max-height: 92vh;
      overflow-y: auto;
      background: rgba(10, 15, 26, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 20px;
      padding: 16px;
      z-index: 1000;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
    }

    .dashboard-panel::-webkit-scrollbar {
      width: 4px;
    }
    .dashboard-panel::-webkit-scrollbar-thumb {
      background: #00f2fe;
      border-radius: 4px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .brand-title {
      color: #00f2fe;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .live-badge {
      background: linear-gradient(45deg, #ff0055, #ff5500);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* Voice Search Box */
    .search-box-container {
      margin-bottom: 12px;
    }

    .voice-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #10b981 0%, #059669 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .voice-btn.listening {
      background: linear-gradient(90deg, #ef4444 0%, #b91c1c 100%);
    }

    .voice-text-display {
      margin-top: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      font-size: 11px;
      color: #00f2fe;
      display: none;
      word-break: break-word;
    }

    /* AI Route Analysis Card */
    .ai-alert-box {
      background: rgba(255, 170, 0, 0.1);
      border: 1px solid #ffaa00;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      display: none;
    }

    .ai-alert-title {
      font-size: 12px;
      font-weight: 800;
      color: #ffaa00;
      margin-bottom: 6px;
    }

    .route-option {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .route-option.recommended {
      border-color: #00ff88;
      background: rgba(0, 255, 136, 0.08);
    }

    .nav-launch-btn {
      background: linear-gradient(135deg, #00f2fe 0%, #0066ff 100%);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .section-heading {
      font-size: 11px;
      font-weight: 800;
      color: #00f2fe;
      margin: 12px 0 8px 0;
      letter-spacing: 0.5px;
    }

    /* Full Twin Cities Signals Grid */
    .signals-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .signal-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .signal-item:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: #00f2fe;
    }

    .signal-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px currentColor;
    }

    .signal-dot.green { background-color: #00ff88; color: #00ff88; }
    .signal-dot.red { background-color: #ff0055; color: #ff0055; }
    .signal-dot.yellow { background-color: #ffaa00; color: #ffaa00; }

    .signal-info .s-name {
      font-size: 11px;
      font-weight: 700;
      color: #f8fafc;
    }

    .signal-info .s-status {
      font-size: 9px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="dashboard-panel">
    <div class="panel-header">
      <div class="brand-title">⚡ ISLAMABAD & PINDI SMART TRAFFIC SYSTEM</div>
      <div class="live-badge">LIVE</div>
    </div>

    <!-- Voice Input Box -->
    <div class="search-box-container">
      <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceNavigation()">
        🎙️ Awaaz Se Rasta Poochhein (Click to Speak)
      </button>
      <div id="voiceStatus" class="voice-text-display"></div>
    </div>

    <!-- AI Smart Route Decision Card -->
    <div class="ai-alert-box" id="aiAlertBox">
      <div class="ai-alert-title">🧠 SMART TRAFFIC ROUTE ANALYSIS</div>
      <div id="aiAnalysisText" style="font-size:11px; color:#e2e8f0; margin-bottom:8px;"></div>

      <div class="route-option recommended">
        <div>
          <div id="targetDestTitle" style="font-size:12px; font-weight:800; color:#00ff88;">Destination Selected</div>
          <div style="font-size:10px; color:#94a3b8;">Analyzed via Twin Cities HD Traffic Network</div>
        </div>
        <button class="nav-launch-btn" onclick="startNavigation()">GO NAVIGATE</button>
      </div>
    </div>

    <!-- All Registered Signals/Chowks Grid -->
    <div class="section-heading">🚦 TWIN CITIES REGISTERED SIGNALS & CHOWKS</div>

    <div class="signals-list" id="signalsGrid">
      <!-- Grid items dynamically rendered via JavaScript -->
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Initialize Map on Islamabad / Pindi
    const map = L.map('map', { zoomControl: false }).setView([33.6844, 73.0479], 12);

    // HD Satellite Tiles
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19
    }).addTo(map);

    let activeDestination = "Centaurus Islamabad";

    // All Major Registered Signals & Intersections across Islamabad & Rawalpindi
    const registeredSignals = [
      { name: "Serena Chowk", status: "VIP Diversion", type: "red", lat: 33.7222, lng: 73.0964 },
      { name: "Kashmir Chowk", status: "Clear / Open", type: "green", lat: 33.7088, lng: 73.1042 },
      { name: "Peshawar Morr", status: "Smooth Flow", type: "green", lat: 33.6828, lng: 73.0315 },
      { name: "Faizabad Junct.", status: "Heavy Traffic", type: "yellow", lat: 33.6629, lng: 73.0858 },
      { name: "Centaurus Chowk", status: "Normal Flow", type: "green", lat: 33.7077, lng: 73.0551 },
      { name: "Zero Point", status: "Clear / Open", type: "green", lat: 33.6931, lng: 73.0653 },
      { name: "F-8 Exchange Signal", status: "Clear", type: "green", lat: 33.7118, lng: 73.0384 },
      { name: "G-9 Markaz Signal", status: "Moderate Rush", type: "yellow", lat: 33.6892, lng: 73.0289 },
      { name: "Ninth Avenue / I-8", status: "Smooth", type: "green", lat: 33.6685, lng: 73.0512 },
      { name: "Kachery Chowk", status: "Work In Progress", type: "yellow", lat: 33.5960, lng: 73.0538 },
      { name: "Chandni Chowk", status: "Clear Underpass", type: "green", lat: 33.6234, lng: 73.0722 },
      { name: "Mural/Rehmanabad", status: "Normal", type: "green", lat: 33.6331, lng: 73.0768 },
      { name: "Saddar Metro Chowk", status: "Heavy Rush", type: "yellow", lat: 33.5932, lng: 73.0552 },
      { name: "Srinagar Hwy Toll", status: "Clear / Fast", type: "green", lat: 33.6265, lng: 72.9150 },
      { name: "Khanna Pul Signal", status: "Congested", type: "red", lat: 33.6212, lng: 73.1189 },
      { name: "Koral Chowk", status: "Smooth Flow", type: "green", lat: 33.5938, lng: 73.1428 }
    ];

    const markers = {};

    // Render Signals List & Map Markers
    const grid = document.getElementById('signalsGrid');
    registeredSignals.forEach((sig) => {
      // Add Map Marker
      const marker = L.marker([sig.lat, sig.lng]).addTo(map)
        .bindPopup(`<b>${sig.name}</b><br>Status: ${sig.status}`);
      markers[sig.name] = marker;

      // Add HTML Item
      const item = document.createElement('div');
      item.className = 'signal-item';
      item.onclick = () => focusSignal(sig.name, sig.lat, sig.lng);
      item.innerHTML = `
        <div class="signal-dot ${sig.type}"></div>
        <div class="signal-info">
          <div class="s-name">${sig.name}</div>
          <div class="s-status">${sig.status}</div>
        </div>
      `;
      grid.appendChild(item);
    });

    // Zoom and open popup when clicking any chowk
    function focusSignal(name, lat, lng) {
      map.flyTo([lat, lng], 15, { duration: 1.5 });
      if (markers[name]) {
        markers[name].openPopup();
      }
    }

    // Direct Exact Google Maps Navigation Trigger
    function startNavigation() {
      const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(activeDestination)}&travelmode=driving`;
      window.open(googleMapsUrl, '_blank');
    }

    // Speech Recognition
    let recognition;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ur-PK';

      recognition.onstart = function() {
        document.getElementById('voiceBtn').classList.add('listening');
        document.getElementById('voiceBtn').innerText = "🔴 Sun Raha Hai... Boliein!";
      };

      recognition.onresult = function(event) {
        const query = event.results[0][0].transcript;
        activeDestination = query;

        const voiceStatus = document.getElementById('voiceStatus');
        voiceStatus.style.display = 'block';
        voiceStatus.innerText = "Aap ne bola: \"" + query + "\"";

        // Show AI Analysis
        document.getElementById('aiAlertBox').style.display = 'block';
        document.getElementById('targetDestTitle').innerText = "Route to: " + query;
        document.getElementById('aiAnalysisText').innerText = `Aapki live location se "${query}" ka rasta hamare HD system ne analyze kar liya hai. Traffic smooth hai.`;

        resetVoiceBtn();
      };

      recognition.onerror = resetVoiceBtn;
      recognition.onend = resetVoiceBtn;
    }

    function toggleVoiceNavigation() {
      if (recognition) {
        recognition.start();
      } else {
        alert("Aap ke browser mein Voice Support nahi hai. Direct click karein.");
      }
    }

    function resetVoiceBtn() {
      document.getElementById('voiceBtn').classList.remove('listening');
      document.getElementById('voiceBtn').innerText = "🎙️ Awaaz Se Rasta Poochhein (Click to Speak)";
    }
  </script>
</body>
  </html>
