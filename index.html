<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Road Snap Navigation</title>
    <!-- MapLibre Engine -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100vh; }
        
        .hud-panel {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(8, 15, 30, 0.95);
            backdrop-filter: blur(20px);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 204, 0.6);
            width: 92%;
            max-width: 390px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        .hud-title { font-size: 13px; font-weight: bold; color: #00ffcc; text-align: center; margin-bottom: 8px; }

        .route-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 10px;
            margin-top: 6px;
            border-radius: 8px;
            border-left: 4px solid #00ffcc;
        }

        .nav-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }

        /* Google Map Style Navigation Cursor */
        .nav-cursor {
            width: 24px;
            height: 24px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2300ffcc"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>');
            background-size: cover;
            filter: drop-shadow(0px 0px 8px #00ffcc);
        }
    </style>
</head>
<body>

<div class="hud-panel">
    <div class="hud-title">🗺️ ISLAMABAD REAL-ROAD NAVIGATION</div>

    <div class="route-option">
        <div>
            <b style="color: #fff; font-size: 12px;">Srinagar Highway</b><br>
            <small style="color: #00ffcc;">Real Road Alignment</small>
        </div>
        <button class="nav-btn" onclick="drawRealRoadRoute([72.8800, 33.6100], [73.0551, 33.7077], '#00ffcc')">NAVIGATE</button>
    </div>

    <div class="route-option" style="border-left-color: #ffaa00;">
        <div>
            <b style="color: #fff; font-size: 12px;">GT Road / Highway</b><br>
            <small style="color: #ffaa00;">Alternate Real Route</small>
        </div>
        <button class="nav-btn" style="background:#ffaa00;" onclick="drawRealRoadRoute([72.9500, 33.6000], [73.0551, 33.7077], '#ffaa00')">NAVIGATE</button>
    </div>
</div>

<div id="map"></div>

<script>
    // Google Satellite HD Map
    const map = new maplibregl.Map({
        container: 'map',
        style: {
            'version': 8,
            'sources': {
                'google-sat': {
                    'type': 'raster',
                    'tiles': ['https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'],
                    'tileSize': 256,
                    'maxzoom': 20
                }
            },
            'layers': [{
                'id': 'google-sat-layer',
                'type': 'raster',
                'source': 'google-sat',
                'minzoom': 0,
                'maxzoom': 20
            }]
        },
        center: [72.9800, 33.6600],
        zoom: 12.5,
        pitch: 45
    });

    let navMarker = null;

    map.on('load', () => {
        // Prepare GeoJSON Source for exact road snapping
        map.addSource('real-road-source', {
            'type': 'geojson',
            'data': {
                'type': 'Feature',
                'geometry': { 'type': 'LineString', 'coordinates': [] }
            }
        });

        // Add Google-like Glow Line on top of roads
        map.addLayer({
            'id': 'real-road-layer',
            'type': 'line',
            'source': 'real-road-source',
            'layout': { 'line-join': 'round', 'line-cap': 'round' },
            'paint': {
                'line-color': '#00ffcc',
                'line-width': 7,
                'line-opacity': 0.9
            }
        });

        // Add Navigation Cursor Marker
        const cursorEl = document.createElement('div');
        cursorEl.className = 'nav-cursor';
        navMarker = new maplibregl.Marker(cursorEl).setLngLat([72.8800, 33.6100]).addTo(map);
    });

    // Fetch Actual Road Routing from OpenStreetMap Routing API
    async function drawRealRoadRoute(startCoords, endCoords, lineColor) {
        const url = `https://router.project-osrm.org/route/v1/driving/${startCoords[0]},${startCoords[1]};${endCoords[0]},${endCoords[1]}?overview=full&geometries=geojson`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (data.routes && data.routes.length > 0) {
                const routeGeometry = data.routes[0].geometry;

                // Update Line to follow EXACT roads
                map.getSource('real-road-source').setData({
                    'type': 'Feature',
                    'geometry': routeGeometry
                });

                map.setPaintProperty('real-road-layer', 'line-color', lineColor);

                // Move Navigation Marker to starting point of road
                navMarker.setLngLat(routeGeometry.coordinates[0]);

                // Smoothly Zoom & Tilt onto the starting road
                map.flyTo({
                    center: routeGeometry.coordinates[0],
                    zoom: 15.5,
                    pitch: 60,
                    bearing: 20,
                    speed: 1.2
                });
            }
        } catch (error) {
            console.error("Routing error:", error);
        }
    }
</script>

</body>
    </html>
