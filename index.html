<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 4K Multi-Route Voice Navigation System</title>
    <!-- MapLibre 3D Vector Engine -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100vh; }
        
        /* Floating HUD Dashboard */
        .hud-panel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(5, 12, 24, 0.90);
            backdrop-filter: blur(16px);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 204, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95);
            width: 92%;
            max-width: 390px;
        }

        .hud-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .hud-title { font-size: 13px; font-weight: bold; color: #00ffcc; letter-spacing: 0.5px; }
        .live-tag { background: #ff0055; color: #fff; font-size: 9px; padding: 2px 7px; border-radius: 10px; font-weight: bold; animation: pulse-red 1.2s infinite; }
        
        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.65);
            padding: 5px;
            border-radius: 8px;
            font-size: 10px;
            margin-bottom: 8px;
            text-align: center;
        }
        .stat-item span { display: block; font-weight: bold; font-size: 11px; }
        .stat-open { color: #00ffcc; }
        .stat-closed { color: #ff3366; }
        .stat-const { color: #ffbb00; }

        .mic-btn {
            background: linear-gradient(135deg, #00ffcc 0%, #0088ff 100%);
            color: #000;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            transition: all 0.3s ease;
        }
        .mic-btn.listening {
            background: linear-gradient(135deg, #ff0055 0%, #ff5500 100%);
            color: #fff;
            animation: pulse-mic 1s infinite;
        }

        .route-card {
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 255, 204, 0.1);
            border-radius: 10px;
            font-size: 11px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            display: none;
        }

        .route-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 8px;
            margin-top: 6px;
            border-radius: 6px;
            border-left: 3px solid #00ffcc;
        }

        .nav-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            background: #fff;
            box-shadow: 0 0 10px #00ffcc;
        }

        .status-box {
            margin-top: 8px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 6px;
            font-size: 10px;
            color: #e2e8f0;
            direction: rtl;
            text-align: right;
        }

        /* 3D HD Vehicle Markers */
        .hd-car {
            width: 14px;
            height: 14px;
            background: #00ffcc;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ffcc, 0 0 24px #00ffcc;
        }
        .hd-car-slow {
            background: #ff3366;
            box-shadow: 0 0 12px #ff3366, 0 0 24px #ff3366;
        }

        @keyframes pulse-mic {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.8); }
            70% { box-shadow: 0 0 0 12px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }
        @keyframes pulse-red {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="hud-panel">
    <div class="hud-header">
        <div class="hud-title">🛰️ 4K ULTRA-HD ROUTE NAVIGATION</div>
        <div class="live-tag">LIVE SIMULATION</div>
    </div>
    
    <div class="stats-bar">
        <div class="stat-item">Total Roads<span>57</span></div>
        <div class="stat-item stat-open">Khuli Hain<span>27</span></div>
        <div class="stat-item stat-closed">Band Hain<span>20</span></div>
        <div class="stat-item stat-const">Work In Progress<span>10</span></div>
    </div>

    <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎙️ Awaaz Se Rasta Poochhein</button>

    <div class="route-card" id="routeDetails"></div>

    <div class="status-box" id="status">
        Misaal: <b>"Faisal Town se Centaurus jana hai"</b> ya <b>"Expressway ka rasta batao"</b>
    </div>
</div>

<div id="map"></div>

<script>
    // High-Resolution 4K Hybrid Satellite Source
    const map = new maplibregl.Map({
        container: 'map',
        style: {
            'version': 8,
            'sources': {
                '4k-satellite': {
                    'type': 'raster',
                    'tiles': [
                        'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'
                    ],
                    'tileSize': 256,
                    'maxzoom': 20
                }
            },
            'layers': [
                {
                    'id': '4k-sat-layer',
                    'type': 'raster',
                    'source': '4k-satellite',
                    'minzoom': 0,
                    'maxzoom': 20
                }
            ]
        },
        center: [73.0551, 33.7077], // Centaurus Islamabad
        zoom: 15.5,
        pitch: 60,
        bearing: -15
    });

    // Vehicle Traffic Simulation Setup
    const carCoordinates = [
        { start: [73.0500, 33.7070], end: [73.0600, 33.7085], speed: 0.000025, color: 'normal' },
        { start: [73.0520, 33.7050], end: [73.0580, 33.7100], speed: 0.000010, color: 'slow' },
        { start: [73.0560, 33.7090], end: [73.0510, 33.7060], speed: 0.000020, color: 'normal' }
    ];

    const carMarkers = [];

    map.on('load', () => {
        carCoordinates.forEach((car) => {
            const el = document.createElement('div');
            el.className = car.color === 'slow' ? 'hd-car hd-car-slow' : 'hd-car';
            
            const marker = new maplibregl.Marker(el)
                .setLngLat(car.start)
                .addTo(map);

            carMarkers.push({
                marker: marker,
                start: car.start,
                end: car.end,
                speed: car.speed,
                progress: 0
            });
        });

        animateVehicles();
    });

    function animateVehicles() {
        carMarkers.forEach(c => {
            c.progress += c.speed;
            if (c.progress > 1) c.progress = 0;

            const lng = c.start[0] + (c.end[0] - c.start[0]) * c.progress;
            const lat = c.start[1] + (c.end[1] - c.start[1]) * c.progress;

            c.marker.setLngLat([lng, lat]);
        });

        requestAnimationFrame(animateVehicles);
    }

    // Comprehensive Dynamic Route DB with Navigation Coordinates
    const locationsDB = {
        'faisal-town': {
            name: "Faisal Town (F-18) to Centaurus Mall",
            coords: [73.0551, 33.7077],
            routes: [
                { id: 'r1', name: "Srinagar Highway", distance: "18 KM", time: "20 Mins", status: "🟢 FAST / NO RUSH", target: [73.0300, 33.6900], speech: "Srinagar Highway ka rasta 18 kilometer ka hai aur rash bilkul nahi hai." },
                { id: 'r2', name: "GT Road / Expressway", distance: "22 KM", time: "32 Mins", status: "🔴 HEAVY SIGNAL TRAFFIC", target: [72.9800, 33.6400], speech: "GT Road par signals ki वजह se 32 minut lagenge." }
            ],
            speech: "Faisal Town se Centaurus jaane ke liye do raste hain. Srinagar Highway best hai jahan 20 minut lagenge. Aap kaunsa rasta select karna chahte hain?"
        },
        'centaurus': {
            name: "Centaurus Mall (Jinnah Avenue)",
            coords: [73.0551, 33.7077],
            routes: [
                { id: 'r1', name: "Main Jinnah Avenue", distance: "2.5 KM", time: "5 Mins", status: "🟢 ALL CLEAR", target: [73.0551, 33.7077], speech: "Jinnah Avenue bilkul khula hai." },
                { id: 'r2', name: "Faisal Avenue Flyover", distance: "3.1 KM", time: "8 Mins", status: "🟡 MODERATE TRAFFIC", target: [73.0580, 33.7020], speech: "Faisal Avenue Flyover par thoda traffic hai." }
            ],
            speech: "Centaurus Mall ke liye Jinnah Avenue aur Faisal Flyover dono raste khule hain."
        }
    };

    // Voice Engine
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ur-PK';
        recognition.continuous = false;

        recognition.onstart = () => {
            isListening = true;
            document.getElementById('micBtn').classList.add('listening');
            document.getElementById('micBtn').innerText = '👂 Sun raha hoon... Bolain';
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('status').innerHTML = `Aapne kaha: <b>"${transcript}"</b>`;
            processCommand(transcript);
        };

        recognition.onend = () => { stopListening(); };
    }

    function toggleVoice() {
        if (!isListening) recognition.start();
        else recognition.stop();
    }

    function stopListening() {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
        document.getElementById('micBtn').innerText = '🎙️ Awaaz Se Rasta Poochhein';
    }

    function processCommand(cmd) {
        const text = cmd.toLowerCase();

        let match = locationsDB['centaurus'];
        if (text.includes('فیصل') || text.includes('faisal town') || text.includes('سری نگر') || text.includes('srinagar')) {
            match = locationsDB['faisal-town'];
        }

        displayRoutes(match);
        speakOut(match.speech);
    }

    function displayRoutes(match) {
        map.flyTo({
            center: match.coords,
            zoom: 14.5,
            pitch: 60,
            bearing: -15,
            speed: 1.2
        });

        const routeCard = document.getElementById('routeDetails');
        routeCard.style.display = 'block';
        
        let html = `<b style="color:#00ffcc;">📍 ${match.name}</b>`;
        
        match.routes.forEach(r => {
            html += `
                <div class="route-item">
                    <div>
                        <b>${r.name}</b><br>
                        <small>${r.distance} | ${r.time} (${r.status})</small>
                    </div>
                    <button class="nav-btn" onclick="startNavigation('${r.name}', [${r.target}], '${r.speech}')">NAVIGATE</button>
                </div>
            `;
        });
        
        routeCard.innerHTML = html;
    }

    // Dynamic Single-Route Navigation Mode
    function startNavigation(routeName, coords, speechText) {
        document.getElementById('status').innerHTML = `🚀 Navigation Active: <b>${routeName}</b>`;
        
        map.flyTo({
            center: coords,
            zoom: 17.5,
            pitch: 70,
            bearing: -30,
            speed: 1.4,
            curve: 1.5
        });

        speakOut(`Navigation shuru kar di gayi hai. ${speechText}`);
    }

    function speakOut(text) {
        const synth = window.speechSynthesis;
        synth.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ur-PK';
        utterance.rate = 0.92;
        utterance.pitch = 1.05;
        
        synth.speak(utterance);
    }
</script>

</body>
            </html>
