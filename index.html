<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamabad 3D Voice Navigation Demo</title>
    <!-- Leaflet & OpenStreetMap 3D Free Libraries -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: #000; color: #fff; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100vh; z-index: 1; }
        
        .overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 18px;
            border-radius: 16px;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            width: 85%;
            max-width: 360px;
            text-align: center;
        }
        h2 { margin: 0 0 6px 0; font-size: 20px; color: #00ffcc; }
        p { font-size: 13px; margin: 0 0 12px 0; color: #ccc; }
        
        .mic-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .mic-btn.listening { background: #ff3366; color: #fff; animation: pulse 1.2s infinite; }
        
        .status-box {
            margin-top: 12px;
            padding: 10px;
            background: #111;
            border-radius: 8px;
            font-size: 13px;
            border-left: 3px solid #00ffcc;
            color: #fff;
            text-align: right;
            direction: rtl;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 51, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); }
        }
    </style>
</head>
<body>

<div class="overlay">
    <h2>3D Traffic Voice System</h2>
    <p>اسلام آباد نیویگیشن (زیرو کاسٹ ڈیمو)</p>
    
    <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎙️ وائس کمانڈ دیں</button>
    
    <div class="status-box" id="status">
        سیٹ اپ تیار ہے۔ بٹن دبا کر بولیں: <br><b>"راستوں کا کیا حال ہے؟"</b> یا <b>"نائنتھ ایونیو جانا ہے"</b>
    </div>
</div>

<div id="map"></div>

<script>
    // Initialize Map on Islamabad Coordinates
    const map = L.map('map').setView([33.6844, 73.0479], 13);

    // Free OpenStreetMap Tile Layer (No Key Required)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Add Islamabad Markers (Routes)
    const ninetheAvenue = L.marker([33.6685, 73.0551]).addTo(map).bindPopup("<b>نائنتھ ایونیو (9th Avenue)</b><br><span style='color:red;'>کنٹینر بلاکیج - بند ہے</span>");
    const srinagarHwy = L.marker([33.6701, 73.0189]).addTo(map).bindPopup("<b>سری نگر ہائی وے</b><br><span style='color:green;'>راستہ مکمل کھلا ہے</span>");
    const blueArea = L.marker([33.7118, 73.0581]).addTo(map).bindPopup("<b>بلو ایریا اسلام آباد</b><br><span style='color:red;'>رش / بندش</span>");

    // Native Browser Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ur-PK';
        recognition.continuous = false;

        recognition.onstart = () => {
            isListening = true;
            document.getElementById('micBtn').classList.add('listening');
            document.getElementById('micBtn').innerText = '👂 سن رہا ہوں... بولیں';
            document.getElementById('status').innerText = 'آواز ریکارڈ ہو رہی ہے...';
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('status').innerHTML = `آپ نے کہا: <b>"${transcript}"</b>`;
            processCommand(transcript);
        };

        recognition.onerror = () => {
            document.getElementById('status').innerText = 'آواز سمجھ نہیں آئی، دوبارہ کوشش کریں۔';
            stopListening();
        };

        recognition.onend = () => { stopListening(); };
    } else {
        alert('براؤزر وائس کو سپورٹ نہیں کرتا، کروم استعمال کریں۔');
    }

    function toggleVoice() {
        if (!isListening) recognition.start();
        else recognition.stop();
    }

    function stopListening() {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
        document.getElementById('micBtn').innerText = '🎙️ وائس کمانڈ دیں';
    }

    function processCommand(cmd) {
        const command = cmd.toLowerCase();

        if (command.includes('حال') || command.includes('راستے') || command.includes('روڈ') || command.includes('اپڈیٹ')) {
            speakOut("اسلام آباد کے 80 میں سے 35 اہم راستے بند ہیں۔ نائنتھ ایونیو اور بلو ایریا بلاک ہیں۔ سری نگر ہائی وے کھلی ہے۔");
            map.flyTo([33.6844, 73.0479], 12);
        } 
        else if (command.includes('نائنتھ') || command.includes('9th') || command.includes('بلو')) {
            speakOut("نائنتھ ایونیو اور بلو ایریا پر بلاکیج ہے۔ وقت ضائع نہ کریں، متبادل سروس روڈ کا راستہ استعمال کریں۔");
            map.flyTo([33.6685, 73.0551], 15);
            ninetheAvenue.openPopup();
        } 
        else if (command.includes('سری نگر') || command.includes('ہائی وے')) {
            speakOut("سری نگر ہائی وے اس وقت مکمل کھلی ہے اور ٹریفک روان دواں ہے۔");
            map.flyTo([33.6701, 73.0189], 14);
            srinagarHwy.openPopup();
        } 
        else {
            speakOut("معذرت، میں سمجھی نہیں۔ آپ اسلام آباد کے روٹس کے بارے میں پوچھیں۔");
        }
    }

    function speakOut(text) {
        const synth = window.speechSynthesis;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ur-PK';
        utterance.rate = 0.9;
        synth.speak(utterance);
    }
</script>

</body>
    </html>
