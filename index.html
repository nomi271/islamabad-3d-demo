<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super 4K Live Motion Navigation</title>
    <!-- MapLibre GL 3D Engine -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100vh; }
        
        /* Floating HUD UI */
        .hud-panel {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(8, 15, 30, 0.92);
            backdrop-filter: blur(20px);
            padding: 14px;
            border-radius: 18px;
            border: 1px solid rgba(0, 255, 204, 0.6);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.95);
            width: 92%;
            max-width: 400px;
        }

        .hud-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .hud-title { font-size: 13px; font-weight: 800; color: #00ffcc; letter-spacing: 0.5px; }
        .live-tag { background: #ff0055; color: #fff; font-size: 9px; padding: 3px 8px; border-radius: 10px; font-weight: bold; animation: blink 1s infinite; }
        
        .mic-btn {
            background: linear-gradient(135deg, #00ffcc 0%, #0088ff 100%);
            color: #000;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            margin-bottom: 10px;
        }

        .route-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            margin-top: 5px;
        }

        .route-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 10px;
            margin-top: 6px;
            border-radius: 8px;
            border-left: 4px solid #00ffcc;
        }
        .route-option.alt { border-left-color: #ffaa00; }

        .nav-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }

        /* Moving Vehicle Marker */
        .car-marker {
            width: 16px;
            height: 16px;
            background: #00ffcc;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc;
        }

        .car-user {
            width: 20px;
            height: 20px;
            background: #ff0055;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 20px #ff0055;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="hud-panel">
    <div class="hud-header">
        <div class="hud-title">⚡ ULTRA 4K LIVE NAVIGATION ENGINE</div>
        <div class="live-tag">LIVE TRAFFIC SIMULATION</div>
    </div>

    <button class="mic-btn" id="micBtn" onclick="startDemoRoute()">🗺️ Faisal Town Se Centaurus Route Shuru Karein</button>

    <div class="route-card" id="routeBox">
        <b style="color: #00ffcc; font-size: 12px;">📍 Select Route (Faisal Town to Centaurus):</b>
        
        <div class="route-option">
            <div>
                <b style="color: #fff; font-size: 12px;">Srinagar Highway</b><br>
                <small style="color: #00ffcc;">20 Mins (18 km) • Fastest Route</small>
            </div>
            <button class="nav-btn" onclick="activateNavigation('srinagar')">NAVIGATE</button>
        </div>

        <div class="route-option alt">
            <div>
                <b style="color: #fff; font-size: 12px;">GT Road / Expressway</b><br>
                <small style="color: #ffaa00;">37 Mins (28 km) • Moderate Traffic</small>
            </div>
            <button class="nav-btn" style="background:#ffaa00;" onclick="activateNavigation('gt')">NAVIGATE</button>
        </div>
    </div>
</div>

<div id="map"></div>

<script>
    // Ultra High Resolution Satellite Tiles
    const map = new maplibregl.Map({
        container: 'map',
        style: {
            'version': 8,
            'sources': {
                'ultra-sat': {
                    'type': 'raster',
                    'tiles': ['https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'], // Google Hybrid HD
                    'tileSize': 256,
                    'maxzoom': 21
                }
            },
            'layers': [{
                'id': 'sat-layer',
                'type': 'raster',
                'source': 'ultra-sat',
                'minzoom': 0,
                'maxzoom': 21
            }]
        },
        center: [72.9300, 33.6300], // Faisal Town / Tarnol Area
        zoom: 12,
        pitch: 55,
        bearing: -10
    });

    // Coordinates for Routes (Faisal Town to Centaurus)
    const srinagarRouteCoords = [
        [72.8800, 33.6100], // Faisal Town
        [72.9500, 33.6350], // Tarnol Interchange
        [73.0100, 33.6700], // Srinagar Hwy
        [73.0551, 33.7077]  // Centaurus Mall
    ];

    const gtRouteCoords = [
        [72.8800, 33.6100], // Faisal Town
        [72.9800, 33.6000], // GT Road
        [73.0700, 33.6500], // Expressway
        [73.0551, 33.7077]  // Centaurus Mall
    ];

    let liveCarMarker = null;
    let animProgress = 0;
    let activeRoutePath = srinagarRouteCoords;

    map.on('load', () => {
        // Draw Srinagar Highway Route Line (Google Maps Style Blue Line)
        map.addSource('route-srinagar', {
            'type': 'geojson',
            'data': {
                'type': 'Feature',
                'geometry': { 'type': 'LineString', 'coordinates': srinagarRouteCoords }
            }
        });

        map.addLayer({
            'id': 'layer-srinagar',
            'type': 'line',
            'source': 'route-srinagar',
            'layout': { 'line-join': 'round', 'line-cap': 'round' },
            'paint': {
                'line-color': '#0066ff',
                'line-width': 8,
                'line-opacity': 0.85
            }
        });

        // Add Live Traffic Moving Vehicle
        const carEl = document.createElement('div');
        carEl.className = 'car-user';
        liveCarMarker = new maplibregl.Marker(carEl)
            .setLngLat(srinagarRouteCoords[0])
            .addTo(map);

        // Traffic Simulation Loop (Live Vehicles Moving)
        animateTraffic();
    });

    function activateNavigation(routeType) {
        let routeCoords = routeType === 'srinagar' ? srinagarRouteCoords : gtRouteCoords;
        activeRoutePath = routeCoords;
        animProgress = 0;

        // Change Route Line Color dynamically
        if (map.getLayer('layer-srinagar')) {
            map.setPaintProperty('layer-srinagar', 'line-color', routeType === 'srinagar' ? '#00ffcc' : '#ffaa00');
        }

        // Camera Follows Route (3D Navigation Zoom Mode)
        map.flyTo({
            center: routeCoords[1],
            zoom: 15.5,
            pitch: 65,
            bearing: 30,
            speed: 1.2
        });

        // Speech Feedback
        const speech = new SpeechSynthesisUtterance(
            routeType === 'srinagar' 
            ? "Srinagar Highway par Navigation shuru kar di gayi hai. Rasta bilkul saaf hai." 
            : "GT Road par navigation shuru ho gayi hai, 37 minut lagayenge."
        );
        speech.lang = 'ur-PK';
        window.speechSynthesis.speak(speech);
    }

    function animateTraffic() {
        if (liveCarMarker && activeRoutePath) {
            animProgress += 0.0015;
            if (animProgress > 1) animProgress = 0;

            // Interpolate position along route
            const totalPoints = activeRoutePath.length - 1;
            const pointIndex = Math.floor(animProgress * totalPoints);
            const nextIndex = Math.min(pointIndex + 1, totalPoints);
            const subProgress = (animProgress * totalPoints) - pointIndex;

            const p1 = activeRoutePath[pointIndex];
            const p2 = activeRoutePath[nextIndex];

            const lng = p1[0] + (p2[0] - p1[0]) * subProgress;
            const lat = p1[1] + (p2[1] - p1[1]) * subProgress;

            liveCarMarker.setLngLat([lng, lat]);
        }
        requestAnimationFrame(animateTraffic);
    }

    function startDemoRoute() {
        activateNavigation('srinagar');
    }
</script>

</body>
            </html>
