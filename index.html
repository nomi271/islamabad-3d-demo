<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Islamabad & Pindi 4K Smart Traffic AI Navigation</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #080c14;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
    }

    #map {
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Floating Main Dashboard */
    .dashboard-panel {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 480px;
      max-height: 88vh;
      overflow-y: auto;
      background: rgba(10, 15, 26, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 20px;
      padding: 14px;
      z-index: 1000;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
      transition: all 0.3s ease;
    }

    /* Collapsed state to show map clearly */
    .dashboard-panel.collapsed {
      max-height: 60px;
      overflow: hidden;
      padding: 10px 14px;
      background: rgba(10, 15, 26, 0.85);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .brand-title {
      color: #00f2fe;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #00f2fe;
      color: #00f2fe;
      padding: 2px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
    }

    /* High Alert System Overview Stats */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px;
      border-radius: 12px;
      text-align: center;
      margin: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stat-card .value {
      font-size: 15px;
      font-weight: 800;
    }

    .stat-card .label {
      font-size: 8px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .voice-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(90deg, #10b981 0%, #059669 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    .voice-btn.listening {
      background: linear-gradient(90deg, #ef4444 0%, #b91c1c 100%);
    }

    .voice-text-display {
      margin-top: 6px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      font-size: 10px;
      color: #00f2fe;
      display: none;
    }

    /* AI Route Decision Card */
    .ai-alert-box {
      background: rgba(255, 170, 0, 0.1);
      border: 1px solid #ffaa00;
      border-radius: 12px;
      padding: 10px;
      margin: 10px 0;
      display: none;
    }

    .route-option {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px;
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .route-option.recommended {
      border-color: #00ff88;
      background: rgba(0, 255, 136, 0.08);
    }

    .route-option.congested {
      border-color: #ff0055;
      background: rgba(255, 0, 85, 0.08);
    }

    .nav-launch-btn {
      background: linear-gradient(135deg, #00f2fe 0%, #0066ff 100%);
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .section-heading {
      font-size: 10px;
      font-weight: 800;
      color: #00f2fe;
      margin: 10px 0 6px 0;
      letter-spacing: 0.5px;
    }

    .signals-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .signal-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .signal-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .signal-dot.green { background-color: #00ff88; }
    .signal-dot.red { background-color: #ff0055; }
    .signal-dot.yellow { background-color: #ffaa00; }

    .signal-info .s-name { font-size: 10px; font-weight: 700; color: #f8fafc; }
    .signal-info .s-status { font-size: 8px; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="dashboard-panel" id="mainPanel">
    <div class="panel-header">
      <div class="brand-title">⚡ ISLAMABAD & PINDI SMART TRAFFIC</div>
      <button class="toggle-btn" onclick="togglePanel()">➖ Hide Panel</button>
    </div>

    <!-- Main System Alert Overview -->
    <div class="stats-container">
      <div class="stat-card"><div class="value" style="color:#ffffff;">32</div><div class="label">Total Routes</div></div>
      <div class="stat-card"><div class="value" style="color:#00ff88;">24</div><div class="label">Khule Hain</div></div>
      <div class="stat-card"><div class="value" style="color:#ff0055;">5</div><div class="label">Band / VIP</div></div>
      <div class="stat-card"><div class="value" style="color:#ffaa00;">3</div><div class="label">In Progress</div></div>
    </div>

    <!-- Voice Input Box -->
    <div>
      <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceNavigation()">
        🎙️ Awaaz Se Rasta Poochhein (Click to Speak)
      </button>
      <div id="voiceStatus" class="voice-text-display"></div>
    </div>

    <!-- AI Smart Multi-Route Decision Card -->
    <div class="ai-alert-box" id="aiAlertBox">
      <div style="font-size:11px; font-weight:800; color:#ffaa00;">🧠 AI ROUTE ANALYZER (2 ROUTES FOUND)</div>
      <div id="aiAnalysisText" style="font-size:10px; color:#e2e8f0; margin:4px 0;"></div>

      <!-- Route 1: Recommended Clear Route -->
      <div class="route-option recommended">
        <div>
          <div style="font-size:11px; font-weight:800; color:#00ff88;">Route 1: Via Srinagar Hwy</div>
          <div style="font-size:9px; color:#94a3b8;">Fastest & Clear Route (12 Mins)</div>
        </div>
        <button class="nav-launch-btn" onclick="startNavigation('Srinagar Highway')">NAVIGATE</button>
      </div>

      <!-- Route 2: Alternate Congested Route -->
      <div class="route-option congested">
        <div>
          <div style="font-size:11px; font-weight:800; color:#ff0055;">Route 2: Via Express Highway</div>
          <div style="font-size:9px; color:#94a3b8;">Heavy Traffic Delay (26 Mins)</div>
        </div>
        <button class="nav-launch-btn" style="background:#ff0055;" onclick="startNavigation('Islamabad Expressway')">NAVIGATE</button>
      </div>
    </div>

    <!-- Registered Signals List -->
    <div class="section-heading">🚦 LIVE REGISTERED CHOWKS & SIGNALS</div>
    <div class="signals-list" id="signalsGrid"></div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([33.6844, 73.0479], 12);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19
    }).addTo(map);

    let currentDestinationClean = "Centaurus Islamabad";

    const registeredSignals = [
      { name: "Serena Chowk", status: "VIP Diversion Active", type: "red", lat: 33.7222, lng: 73.0964 },
      { name: "Kashmir Chowk", status: "Clear / Open", type: "green", lat: 33.7088, lng: 73.1042 },
      { name: "Peshawar Morr", status: "Smooth Flow", type: "green", lat: 33.6828, lng: 73.0315 },
      { name: "Faizabad Junct.", status: "Heavy Traffic Rush", type: "yellow", lat: 33.6629, lng: 73.0858 },
      { name: "Centaurus Chowk", status: "Normal Flow", type: "green", lat: 33.7077, lng: 73.0551 },
      { name: "Zero Point", status: "Clear / Open", type: "green", lat: 33.6931, lng: 73.0653 },
      { name: "Ninth Avenue / I-8", status: "Clear Signal", type: "green", lat: 33.6685, lng: 73.0512 },
      { name: "Kachery Chowk (Pindi)", status: "Flyover Construction", type: "yellow", lat: 33.5960, lng: 73.0538 },
      { name: "Chandni Chowk", status: "Clear Underpass", type: "green", lat: 33.6234, lng: 73.0722 },
      { name: "6th Road Metro", status: "Normal Flow", type: "green", lat: 33.6331, lng: 73.0768 }
    ];

    const markers = {};
    const grid = document.getElementById('signalsGrid');

    registeredSignals.forEach((sig) => {
      const marker = L.marker([sig.lat, sig.lng]).addTo(map)
        .bindPopup(`<b>${sig.name}</b><br>Status: ${sig.status}`);
      markers[sig.name] = marker;

      const item = document.createElement('div');
      item.className = 'signal-item';
      item.onclick = () => focusSignal(sig.name, sig.lat, sig.lng);
      item.innerHTML = `
        <div class="signal-dot ${sig.type}"></div>
        <div class="signal-info">
          <div class="s-name">${sig.name}</div>
          <div class="s-status">${sig.status}</div>
        </div>
      `;
      grid.appendChild(item);
    });

    // Zoom to Signal and Automatically Minimize Panel to reveal map
    function focusSignal(name, lat, lng) {
      map.flyTo([lat, lng], 16, { duration: 1.5 });
      if (markers[name]) {
        markers[name].openPopup();
      }
      // Minimize panel so user can see HD map
      document.getElementById('mainPanel').classList.add('collapsed');
      document.querySelector('.toggle-btn').innerText = "➕ Open Panel";
    }

    function togglePanel() {
      const panel = document.getElementById('mainPanel');
      const btn = document.querySelector('.toggle-btn');
      if (panel.classList.contains('collapsed')) {
        panel.classList.remove('collapsed');
        btn.innerText = "➖ Hide Panel";
      } else {
        panel.classList.add('collapsed');
        btn.innerText = "➕ Open Panel";
      }
    }

    // Fixed Google Maps Navigation (Forced Islamabad/Pindi Region)
    function startNavigation(viaRoute) {
      let query = currentDestinationClean;
      if (!query.toLowerCase().includes("islamabad") && !query.toLowerCase().includes("rawalpindi")) {
        query += ", Islamabad, Pakistan";
      }
      const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(query)}&travelmode=driving`;
      window.open(googleMapsUrl, '_blank');
    }

    // Voice Processing & Query Cleaning
    let recognition;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ur-PK';

      recognition.onstart = function() {
        document.getElementById('voiceBtn').classList.add('listening');
        document.getElementById('voiceBtn').innerText = "🔴 Sun Raha Hai... Boliein!";
      };

      recognition.onresult = function(event) {
        let rawSpeech = event.results[0][0].transcript;
        
        // Clean up conversational filler Urdu words
        let cleanText = rawSpeech.replace(/مجھے|یہاں|سے|جانا|ہے|کو|لیے|کر دیں/g, '').trim();
        if (cleanText === "") cleanText = rawSpeech;

        currentDestinationClean = cleanText;

        const voiceStatus = document.getElementById('voiceStatus');
        voiceStatus.style.display = 'block';
        voiceStatus.innerText = "Destination: \"" + cleanText + "\"";

        // Display AI Multi-Route Box
        document.getElementById('aiAlertBox').style.display = 'block';
        document.getElementById('aiAnalysisText').innerText = `Aap ne "${cleanText}" ke liye rasta poocha hai. Twin Cities System ne 2 behtareen routes analyze kiye hain:`;

        resetVoiceBtn();
      };

      recognition.onerror = resetVoiceBtn;
      recognition.onend = resetVoiceBtn;
    }

    function toggleVoiceNavigation() {
      if (recognition) {
        recognition.start();
      }
    }

    function resetVoiceBtn() {
      document.getElementById('voiceBtn').classList.remove('listening');
      document.getElementById('voiceBtn').innerText = "🎙️ Awaaz Se Rasta Poochhein (Click to Speak)";
    }
  </script>
</body>
  </html>
