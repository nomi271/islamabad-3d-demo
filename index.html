<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 3D Satellite Live Traffic & Voice Navigation</title>
    <!-- MapLibre 3D Vector Map Engine -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100vh; }
        
        /* Compact Floating HUD Navigation Panel */
        .hud-panel {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(5, 12, 24, 0.88);
            backdrop-filter: blur(12px);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9);
            width: 92%;
            max-width: 380px;
        }

        .hud-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .hud-title { font-size: 13px; font-weight: bold; color: #00ffcc; letter-spacing: 0.5px; }
        .live-tag { background: #ff0055; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 10px; font-weight: bold; animation: pulse-red 1.5s infinite; }
        
        /* Live City Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px;
            border-radius: 8px;
            font-size: 10px;
            margin-bottom: 8px;
            text-align: center;
        }
        .stat-item span { display: block; font-weight: bold; font-size: 11px; }
        .stat-open { color: #00ffcc; }
        .stat-closed { color: #ff3366; }
        .stat-const { color: #ffbb00; }

        .mic-btn {
            background: linear-gradient(135deg, #00ffcc 0%, #0088ff 100%);
            color: #000;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.3);
            transition: all 0.3s ease;
        }
        .mic-btn.listening {
            background: linear-gradient(135deg, #ff0055 0%, #ff5500 100%);
            color: #fff;
            animation: pulse-mic 1s infinite;
        }

        .route-card {
            margin-top: 6px;
            padding: 6px 8px;
            background: rgba(0, 255, 204, 0.1);
            border-radius: 8px;
            font-size: 10px;
            border-left: 3px solid #00ffcc;
            display: none;
        }

        .status-box {
            margin-top: 6px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 6px;
            font-size: 10px;
            color: #e2e8f0;
            direction: rtl;
            text-align: right;
        }

        /* Animated Vehicle Marker Style */
        .car-marker {
            width: 12px;
            height: 12px;
            background-color: #00ffcc;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
        }
        .car-marker-slow {
            background-color: #ff3366;
            box-shadow: 0 0 10px #ff3366;
        }

        @keyframes pulse-mic {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }
        @keyframes pulse-red {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="hud-panel">
    <div class="hud-header">
        <div class="hud-title">🛰️ SATELLITE LIVE 3D TRAFFIC</div>
        <div class="live-tag">LIVE MOVING CARS</div>
    </div>
    
    <!-- Live Roads Dashboard Stat -->
    <div class="stats-bar">
        <div class="stat-item">Total Roads<span>57</span></div>
        <div class="stat-item stat-open">Khuli Hain<span>27</span></div>
        <div class="stat-item stat-closed">Band Hain<span>20</span></div>
        <div class="stat-item stat-const">Work In Progress<span>10</span></div>
    </div>

    <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎙️ Awaaz Se Rasta Poochhein</button>

    <div class="route-card" id="routeDetails"></div>

    <div class="status-box" id="status">
        Misaal: <b>"Centaurus Mall jana hai"</b> ya <b>"Express Highway ka rasta batao"</b>
    </div>
</div>

<div id="map"></div>

<script>
    // Initialize Real 3D Satellite Map Engine
    const map = new maplibregl.Map({
        container: 'map',
        style: {
            'version': 8,
            'sources': {
                'raster-tiles': {
                    'type': 'raster',
                    'tiles': [
                        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
                    ],
                    'tileSize': 256,
                    'attribution': 'Esri World Imagery'
                }
            },
            'layers': [
                {
                    'id': 'simple-tiles',
                    'type': 'raster',
                    'source': 'raster-tiles',
                    'minzoom': 0,
                    'maxzoom': 19
                }
            ]
        },
        center: [73.0551, 33.7077], // Centaurus / Jinnah Avenue Islamabad
        zoom: 15.8,
        pitch: 65,
        bearing: -15
    });

    // Add Simulated Moving Vehicles on Roads (Live Traffic Movement)
    const carCoordinates = [
        { start: [73.0500, 33.7070], end: [73.0600, 33.7085], speed: 0.00003, color: 'normal' },
        { start: [73.0520, 33.7050], end: [73.0580, 33.7100], speed: 0.000015, color: 'slow' },
        { start: [73.0560, 33.7090], end: [73.0510, 33.7060], speed: 0.000025, color: 'normal' }
    ];

    const carMarkers = [];

    map.on('load', () => {
        carCoordinates.forEach((car, index) => {
            const el = document.createElement('div');
            el.className = car.color === 'slow' ? 'car-marker car-marker-slow' : 'car-marker';
            
            const marker = new maplibregl.Marker(el)
                .setLngLat(car.start)
                .addTo(map);

            carMarkers.push({
                marker: marker,
                current: [...car.start],
                start: car.start,
                end: car.end,
                speed: car.speed,
                progress: 0
            });
        });

        animateVehicles();
    });

    // Smooth Vehicle Movement Loop
    function animateVehicles() {
        carMarkers.forEach(c => {
            c.progress += c.speed;
            if (c.progress > 1) c.progress = 0;

            const lng = c.start[0] + (c.end[0] - c.start[0]) * c.progress;
            const lat = c.start[1] + (c.end[1] - c.start[1]) * c.progress;

            c.marker.setLngLat([lng, lat]);
        });

        requestAnimationFrame(animateVehicles);
    }

    // Knowledge Base for Dynamic Navigation
    const locationsDB = {
        'centaurus': {
            name: "Centaurus Mall (Jinnah Avenue)",
            coords: [73.0551, 33.7077],
            zoom: 16.5,
            routes: [
                { name: "Main Jinnah Avenue", distance: "2.5 KM", time: "5 Mins", status: "🟢 CLEAR & LIVE TRAFFIC MOVING" },
                { name: "Faisal Avenue Flyover", distance: "3.1 KM", time: "8 Mins", status: "🟡 MODERATE TRAFFIC AT SIGNAL" }
            ],
            speech: "Centaurus Mall ke liye Jinnah Avenue wala rasta bilkul khula hai aur traffic smooth chal rahi hai. Faisal Avenue flyover par thoda signal rush hai."
        },
        'expressway': {
            name: "Islamabad Express Highway (DHA Phase 1/2)",
            coords: [73.1000, 33.6200],
            zoom: 14.5,
            routes: [
                { name: "Main Expressway", distance: "18 KM", time: "35 Mins", status: "🔴 HEAVY EVENING RUSH / SLOW TRAFFIC" },
                { name: "Service Road Alternate", distance: "19.5 KM", time: "22 Mins", status: "🟢 RECOMMENDED (SAVINGS: 13 MINS)" }
            ],
            speech: "Islamabad Express Highway par sham ke waqt signal aur rush ki wajah se 35 minut lagenge. Hamara mashwara hai ke aap Service Road ka rasta istemal karein jisse aap ke 13 minut bachein ge."
        },
        'murree': {
            name: "Murree Road (Islamabad to Murree)",
            coords: [73.1582, 33.7297],
            zoom: 14.0,
            routes: [
                { name: "Route 1: Expressway", distance: "38 KM", time: "45 Mins", status: "🟢 CLEAR & OPEN" },
                { name: "Route 2: Old Toll Plaza", distance: "42 KM", time: "55 Mins", status: "🟡 UNDER CONSTRUCTION" }
            ],
            speech: "Murree Road ke Expressway raste par traffic normal hai. Old Toll Plaza par repair work chal raha hai."
        }
    };

    // Voice Engine Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ur-PK';
        recognition.continuous = false;

        recognition.onstart = () => {
            isListening = true;
            document.getElementById('micBtn').classList.add('listening');
            document.getElementById('micBtn').innerText = '👂 Sun raha hoon... Bolain';
            document.getElementById('status').innerText = 'Recording voice command...';
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('status').innerHTML = `Aapne kaha: <b>"${transcript}"</b>`;
            processCommand(transcript);
        };

        recognition.onerror = () => {
            document.getElementById('status').innerText = 'Awaaz samajh nahi aayi, dobara boliye.';
            stopListening();
        };

        recognition.onend = () => { stopListening(); };
    }

    function toggleVoice() {
        if (!isListening) recognition.start();
        else recognition.stop();
    }

    function stopListening() {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
        document.getElementById('micBtn').innerText = '🎙️ Awaaz Se Rasta Poochhein';
    }

    function processCommand(cmd) {
        const text = cmd.toLowerCase();

        let match = locationsDB['centaurus'];
        if (text.includes('ایکسپریس') || text.includes('expressway') || text.includes('دھابی') || text.includes('dha')) match = locationsDB['expressway'];
        else if (text.includes('مری') || text.includes('murree')) match = locationsDB['murree'];

        // Dynamic 3D Camera Navigation Animation
        map.flyTo({
            center: match.coords,
            zoom: match.zoom,
            pitch: 65,
            bearing: -20,
            speed: 1.2,
            curve: 1.4
        });

        // Display Route Calculation Card
        const routeCard = document.getElementById('routeDetails');
        routeCard.style.display = 'block';
        let html = `<b>📍 ${match.name}</b><br>`;
        match.routes.forEach(r => {
            html += `<div style="margin-top:4px;"><b>${r.name}:</b> ${r.distance} | ${r.time} <br><small>${r.status}</small></div>`;
        });
        routeCard.innerHTML = html;

        // Speak Natural Voice
        speakOut(match.speech);
    }

    function speakOut(text) {
        const synth = window.speechSynthesis;
        synth.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ur-PK';
        utterance.rate = 0.92;
        utterance.pitch = 1.05;
        
        synth.speak(utterance);
    }
</script>

</body>
    </html>
